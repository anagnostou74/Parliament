plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

android {
    namespace = 'gr.mobap'
    compileSdkVersion = 36

    defaultConfig {
        applicationId 'gr.mobap'
        minSdkVersion 24
        targetSdkVersion 36
        versionCode = 55
        versionName = "2025.10.19 calendar"

        multiDexEnabled = true
        vectorDrawables.useSupportLibrary = true

        ndk {
            abiFilters += ['armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64']
        }

        resValue 'string', 'GOOGLE_SIGN_IN_ID', GOOGLE_SIGN_IN_ID
        resValue 'string', 'google_maps_key', GOOGLE_MAPS_KEY

    }

    signingConfigs {
        release {
            keyAlias = 'panathinaikos'
            keyPassword = ANDROID_STORE_PASSWORD
            storeFile = file("C:\\Users\\kanag\\OneDrive - Ministry of Digital Governance\\Βουλή\\Dev\\Peri Voulis\\google_dev_console.jks")
            storePassword = ANDROID_KEY_PASSWORD
        }
        config {
            storeFile = file('C:/Users/kanag/.android/debug.keystore')
            keyAlias = 'androiddebugkey'
            keyPassword = 'android'
            storePassword = 'android'
        }
    }

    buildTypes {
        all {
            buildConfigField 'String', 'PARSE_KEY', "\"${ParseKey}\""
            buildConfigField 'String', 'YOUTUBE_KEY', "\"${YoutubeKey}\""
            buildConfigField 'String', 'CONSUMER_KEY', "\"${ConsumerKey}\""
            buildConfigField 'String', 'CONSUMER_SECRET', "\"${ConsumerSecret}\""
        }
        release {
            minifyEnabled = true
            shrinkResources = true
            multiDexKeepFile = file('multidex-config.txt')
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig = signingConfigs.release
        }
        debug {
            signingConfig = signingConfigs.config
        }
        stagingRelease {
            initWith(release)
            debuggable true
            matchingFallbacks = ["release"]
        }
    }

    buildFeatures {
        buildConfig = true
    }

    packagingOptions {
        resources {
            excludes += [
                    'META-INF/DEPENDENCIES',
                    'META-INF/NOTICE',
                    'META-INF/LICENSE',
                    'META-INF/LICENSE.txt',
                    'META-INF/NOTICE.txt',
                    'META-INF/LICENSE-FIREBASE.txt'
            ]
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled = true
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation files('libs/YouTubeAndroidPlayerApi.jar')

    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.core:core:1.17.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.gridlayout:gridlayout:1.1.0'

    implementation 'com.google.android.gms:play-services-maps:19.2.0'
    implementation 'com.google.android.gms:play-services-base:18.9.0'
    implementation 'com.google.android.gms:play-services-auth:21.4.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    implementation platform('com.google.firebase:firebase-bom:34.4.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-crashlytics'

    implementation 'com.firebaseui:firebase-ui-database:9.0.0'


    implementation 'com.github.bumptech.glide:glide:5.0.5'
    annotationProcessor 'com.github.bumptech.glide:compiler:5.0.5'

    implementation 'com.devbrackets.android:exomedia:5.2.0'
    implementation 'org.jsoup:jsoup:1.21.2'
    implementation 'com.squareup.okhttp3:okhttp:5.2.1'
    implementation('com.parse:parse-android:1.17.3') {
        exclude group: 'com.android.support'
    }
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'

    implementation 'de.hdodenhof:circleimageview:3.1.0'

    testImplementation 'junit:junit:4.13.2'

    implementation "androidx.viewpager2:viewpager2:1.1.0"
    implementation "com.google.android.material:material:<τελευταία-έκδοση>"

}
